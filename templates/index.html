<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexStream Pro - Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-btn {
            box-shadow: 0 0 20px -3px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 30px 2px rgba(236, 72, 153, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent">
                NexStream Downloader
            </h1>
            <p class="text-slate-400 text-sm mt-1.5">YouTube & TikTok with Quality Selector</p>
        </div>

        <!-- Input Box -->
        <div class="glass rounded-2xl p-2 flex flex-col sm:flex-row gap-2 shadow-2xl mb-6">
            <input 
                id="urlInput" 
                type="text" 
                placeholder="Paste link here..." 
                class="bg-transparent px-4 py-3 text-sm flex-1 outline-none text-white placeholder-slate-500"
            />
            <button 
                id="fetchBtn" 
                onclick="fetchInfo()" 
                class="bg-gradient-to-r from-pink-500 to-indigo-600 px-6 py-3 rounded-xl font-semibold text-sm text-white glow-btn flex items-center justify-center gap-2 cursor-pointer">
                <span>Fetch</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- Loading -->
        <div id="loader" class="hidden text-center py-6">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-3 border-pink-500 border-t-transparent"></div>
            <p class="text-xs text-slate-400 mt-2">အချက်အလက်များ ရှာဖွေနေပါသည်...</p>
        </div>

        <!-- Error -->
        <div id="errorBox" class="hidden glass border-red-500/30 text-red-400 p-4 rounded-xl text-sm mb-6 flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation text-lg"></i>
            <span id="errorMessage"></span>
        </div>

        <!-- Video Card & Quality Select -->
        <div id="card" class="hidden glass p-5 rounded-2xl border border-white/10 shadow-2xl transition-all">
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="relative w-full sm:w-44 h-28 rounded-xl overflow-hidden bg-slate-800 flex-shrink-0">
                    <img id="thumb" class="w-full h-full object-cover" src="">
                    <span id="duration" class="absolute bottom-2 right-2 bg-black/80 text-[11px] px-2 py-0.5 rounded text-slate-200"></span>
                </div>
                <div class="flex flex-col justify-between flex-1">
                    <div>
                        <h3 id="title" class="font-semibold text-sm md:text-base line-clamp-2 leading-snug"></h3>
                        <p id="author" class="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-user-circle"></i> <span id="uploaderText"></span>
                        </p>
                    </div>

                    <!-- Quality Selector Dropdown -->
                    <div class="mt-4 flex flex-col sm:flex-row gap-2">
                        <select id="qualitySelect" class="bg-slate-900/90 border border-white/15 text-slate-200 text-xs rounded-xl px-3 py-2.5 outline-none flex-1 cursor-pointer">
                        </select>
                        <button 
                            id="dlBtn" 
                            onclick="downloadMedia()" 
                            class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-download"></i>
                            <span>Download</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUrl = '';

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value.trim();
            const loader = document.getElementById('loader');
            const errorBox = document.getElementById('errorBox');
            const card = document.getElementById('card');
            const fetchBtn = document.getElementById('fetchBtn');

            if (!url) return;

            errorBox.classList.add('hidden');
            card.classList.add('hidden');
            loader.classList.remove('hidden');
            fetchBtn.disabled = true;

            try {
                const res = await fetch('/get-info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                currentUrl = url;
                document.getElementById('title').innerText = data.title;
                document.getElementById('uploaderText').innerText = data.uploader;
                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('duration').innerText = data.duration;

                // Build Quality Options
                const select = document.getElementById('qualitySelect');
                select.innerHTML = '';
                data.qualities.forEach(q => {
                    const opt = document.createElement('option');
                    opt.value = q;
                    opt.innerText = q;
                    select.appendChild(opt);
                });

                card.classList.remove('hidden');
            } catch(e) {
                document.getElementById('errorMessage').innerText = e.message;
                errorBox.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                fetchBtn.disabled = false;
            }
        }

        async function downloadMedia() {
            const btn = document.getElementById('dlBtn');
            const quality = document.getElementById('qualitySelect').value;
            const originalHTML = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = `<div class="animate-spin rounded-full h-3.5 w-3.5 border-2 border-white border-t-transparent"></div> Processing...`;

            try {
                const res = await fetch('/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url: currentUrl, quality: quality })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'ဒေါင်းလုဒ်မအောင်မြင်ပါ');
                }

                const blob = await res.blob();
                const disposition = res.headers.get('Content-Disposition');
                let filename = 'download';
                if (disposition && disposition.includes('filename=')) {
                    filename = disposition.split('filename=')[1].replace(/['"]/g, '');
                }

                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = decodeURIComponent(filename);
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

            } catch(e) {
                alert(e.message);
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
