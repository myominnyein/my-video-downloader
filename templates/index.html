<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px;">
    <h2>YouTube & TikTok Downloader</h2>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/">
        <input type="text" name="url" placeholder="Paste YouTube or TikTok link here" style="width: 350px; padding: 8px;" required>
        <button type="submit" style="padding: 8px 16px; cursor: pointer;">Download</button>
    </form>
</body>
</html>
